<!DOCTYPE html>
<html lang="es">

<head>
    <title>Wendys Menu</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/normalize.css">
    <link rel="stylesheet" href="style/general.css">
    <link rel="stylesheet" href="style/menucarrousel.css">
    <link rel="stylesheet" href="style/general.css">

</head>

<body>
    <header>
        <div id="header-in">
            <a href=""><img class="opcionesH" src="imagenes/UI icons/Opciones.png" alt="Opcioness"></a>
            <a href=""><img class="logoH" src="imagenes/UI icons/LogoColor.png" alt="Wendy's"></a>
            <a href=""><img class="ubicacionH" src="imagenes/UI icons/Ubicacion.png" alt="Sucursales"></a>
        </div>
    </header>

    <section class="ofertasContainer">        
        <h2>OFERTAS(add-in)</h2>
        <img src="oferta 1">
            <button></button>
        <img src="oferta 2">
            <button></button>
        <img src="oferta 3">
            <button></button>  
    </section> 

    <section class="menuContainer">   
        <h2>MENU</h2>

        <h4>Hamburguesas</h4>
        <section class="carrousel" id="carrousel">
            <article class="containerSlider">
                <button class="prev">&lt;</button>
                <div class="track">
                    <div class="slide">
                        <img src="imagenes/BURGER icons/baconator.png">
                        <div class="caption">Baconator</div>
                    </div>

                    <div class="slide">
                        <img src="imagenes/BURGER icons/daves-single.png">
                        <div class="caption">Dave's Single</div>
                    </div>

                    <div class="slide">
                        <img src="imagenes/BURGER icons/double-stack.png">
                        <div class="caption">Double Stack</div>
                    </div>

                    <div class="slide">
                        <img src="imagenes/BURGER icons/big-bacon-classic.png">
                        <div class="caption">Classic de Tocino</div>
                    </div>

                    <div class="slide">
                        <img src="imagenes/BURGER icons/jr-cheeseburger.png">
                        <div class="caption">Queso Jr</div>
                    </div>
                </div>
                <button class="next"> &gt; </button>
            </article>
        </section>

        <h4>Pollo</h4>
        <section class="carrousel" id="carrousel">
            <article class="containerSlider">
                <button class="prev">&lt;</button>
                <div class="track">
                    <div class="slide">
                        <img src="imagenes/CHICKEN icons/chicken sandwich.png">
                        <div class="caption">Sandwich de Pollo</div>
                    </div>

                    <div class="slide">
                        <img src="imagenes/CHICKEN icons/chicken-blt.png">
                        <div class="caption">Sandwich de Pollo (+Tocino) </div>
                    </div>

                    <div class="slide">
                        <img src="imagenes/CHICKEN icons/grilled-chicken-wrap.png">
                        <div class="caption">Wrap de Pollo</div>
                    </div>

                    <div class="slide">
                        <img src="imagenes/CHICKEN icons/chicken-nuggets.png">
                        <div class="caption">Nuggets de Pollo</div>
                    </div>

                    <div class="slide">
                        <img src="imagenes/CHICKEN icons/spicy-nuggets.png">
                        <div class="caption">Nuggets de Pollo (Spicy)</div>
                    </div>
                </div>
                <button class="next"> &gt; </button>
            </article>
        </section>

        <h4>Bebidas</h4>
        <section class="carrousel" id="carrousel">
            <article class="containerSlider">
                <button class="prev">&lt;</button>
                <div class="track">
                    <div class="slide">
                        <img src="imagenes/DRINK icons/coke.png">
                        <div class="caption">Coca-Cola</div>
                    </div>

                    <div class="slide">
                        <img src="imagenes/DRINK icons/fanta.png">
                        <div class="caption">Fanta</div>
                    </div>

                    <div class="slide">
                        <img src="imagenes/DRINK icons/oj.png">
                        <div class="caption">Jugo de Naranja</div>
                    </div>

                    <div class="slide">
                        <img src="imagenes/DRINK icons/frosty.png">
                        <div class="caption">Frosty</div>
                    </div>

                    <div class="slide">
                        <img src="imagenes/DRINK icons/malt.png">
                        <div class="caption">Malteada</div>
                    </div>
                </div>
                <button class="next"> &gt; </button>
            </article>
        </section>

    </section> 

    <section class="pedidoContainer">        
        <h2>Opcion de pedido y footer</h2>
        <img src="oferta 1"> 
    </section> 

<script src="js/carrousel.js"></script> 

</body>
</html>
